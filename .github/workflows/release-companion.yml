name: Release Companion

on:
  push:
    tags:
      - 'companion-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows
            goos: windows
            goarch: amd64
            ext: .exe
          - os: linux
            goos: linux
            goarch: amd64
            ext: ""
          - os: macos
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-arm
            goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build native host
        working-directory: companion
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o native_host${{ matrix.ext }} native_host.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native_host-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: companion/native_host${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            asset_name=$(basename "$dir")
            binary=$(find "$dir" -type f | head -1)
            cp "$binary" "release/${asset_name}"
            echo "  $asset_name"
          done
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Companion ${{ github.ref_name }}"
          files: release/*
          generate_release_notes: true
